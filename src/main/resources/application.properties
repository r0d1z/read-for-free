quarkus.application.name=read-for-free
quarkus.http.port=8080

# OpenTelemetry -> Local OTel Collector (Mimir + Tempo)
quarkus.devservices.enabled=false
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.metric.export.interval=5s
%test.quarkus.otel.traces.exporter=none
%test.quarkus.otel.metrics.exporter=none

# Book Repositories & Download Configuration
books.storage.directory=downloads
books.http.timeout-seconds=20
books.rate-limit.real-permits-per-repo=4
books.rate-limit.mock-permits-per-repo=5000

books.repos.gutendex.base-url=https://gutendex.com
books.repos.openlibrary.base-url=https://openlibrary.org
books.repos.internet-archive.base-url=https://archive.org
books.repos.mock.base-url=http://localhost:8089
