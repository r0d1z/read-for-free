apiVersion: 1

datasources:
  - name: Mimir
    type: prometheus
    uid: mimir-prometheus
    access: proxy
    orgId: 1
    url: http://mimir:8080/prometheus
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST

  - name: Tempo
    type: tempo
    uid: tempo-traces
    access: proxy
    orgId: 1
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
